name: Build macOS DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ngrok and ripgrep
        run: |
          brew install ripgrep
          brew install --cask ngrok

      - name: Build DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) VERSION="0.0.0-${GITHUB_SHA::7}" ;; esac
          bash packaging/build_mac.sh "$VERSION"

      - name: Smoke test
        run: venv/bin/python packaging/smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: CodyMCPServer-dmg-${{ matrix.os }}
          path: packaging/installer_output/*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/installer_output/*.dmg
